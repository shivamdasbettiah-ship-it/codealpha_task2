<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calc Pro — Premium Calculator</title>
  <meta name="description" content="A sleek, modern calculator with all arithmetic operations, keyboard support, and beautiful glassmorphism design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <main class="calculator-wrapper" role="main">
    <h1 class="app-title">Calc <span>Pro</span></h1>

    <!-- Calculator Card -->
    <div class="calculator" id="calculator" aria-label="Calculator">

      <!-- Display -->
      <section class="display" aria-label="Calculator display">
        <div class="display-expression" id="display-expression" aria-live="polite" aria-label="Expression"></div>
        <div class="display-main" id="display-main" aria-live="assertive" aria-label="Current value">0</div>
      </section>

      <!-- Keyboard Hint -->
      <div class="keyboard-hint" id="keyboard-hint">
        <span class="hint-icon">⌨</span> Keyboard supported
      </div>

      <!-- Button Grid -->
      <div class="btn-grid" role="group" aria-label="Calculator buttons">

        <!-- Row 1 -->
        <button class="btn btn-function btn-wide" id="btn-clear" data-action="clear" aria-label="Clear all">AC</button>
        <button class="btn btn-function" id="btn-sign" data-action="sign" aria-label="Toggle sign">+/−</button>
        <button class="btn btn-function" id="btn-percent" data-action="percent" aria-label="Percent">%</button>
        <button class="btn btn-operator" id="btn-divide" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-number" id="btn-7" data-action="number" data-value="7" aria-label="7">7</button>
        <button class="btn btn-number" id="btn-8" data-action="number" data-value="8" aria-label="8">8</button>
        <button class="btn btn-number" id="btn-9" data-action="number" data-value="9" aria-label="9">9</button>
        <button class="btn btn-operator" id="btn-multiply" data-action="operator" data-value="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="btn btn-number" id="btn-4" data-action="number" data-value="4" aria-label="4">4</button>
        <button class="btn btn-number" id="btn-5" data-action="number" data-value="5" aria-label="5">5</button>
        <button class="btn btn-number" id="btn-6" data-action="number" data-value="6" aria-label="6">6</button>
        <button class="btn btn-operator" id="btn-subtract" data-action="operator" data-value="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="btn btn-number" id="btn-1" data-action="number" data-value="1" aria-label="1">1</button>
        <button class="btn btn-number" id="btn-2" data-action="number" data-value="2" aria-label="2">2</button>
        <button class="btn btn-number" id="btn-3" data-action="number" data-value="3" aria-label="3">3</button>
        <button class="btn btn-operator" id="btn-add" data-action="operator" data-value="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="btn btn-number btn-wide" id="btn-0" data-action="number" data-value="0" aria-label="0">0</button>
        <button class="btn btn-number" id="btn-decimal" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="btn btn-equals" id="btn-equals" data-action="equals" aria-label="Equals">=</button>

      </div>

      <!-- History Panel -->
      <div class="history-panel" id="history-panel">
        <div class="history-header">
          <span>Recent</span>
          <button class="history-clear-btn" id="history-clear-btn" aria-label="Clear history">Clear</button>
        </div>
        <ul class="history-list" id="history-list" aria-label="Calculation history">
          <li class="history-empty">No calculations yet</li>
        </ul>
      </div>

    </div>

    <!-- Toggle History Button -->
    <button class="toggle-history-btn" id="toggle-history-btn" aria-label="Toggle history panel" aria-expanded="false">
      <span class="history-icon">🕘</span> History
    </button>

  </main>

  <script src="script.js"></script>
</body>
</html>
